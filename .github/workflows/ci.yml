# Lint, type check and tests on every push and pull request.
# Python 3.11 = Raspberry Pi OS Bookworm, 3.13 = Trixie.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Format (ruff format)
        run: ruff format --check qc tests main.py
      - name: Lint (ruff)
        run: ruff check qc tests main.py
      - name: Types (mypy)
        run: mypy
      - name: Tests (pytest)
        run: pytest --cov --cov-report=term
